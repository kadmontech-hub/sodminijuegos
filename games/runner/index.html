<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020608" />
    <meta name="description" content="SØD Runner — endless runner de precisión del ecosistema SØD." />
    <title>SØD Runner</title>
    <link rel="icon" href="/public/assets/player.png" />
    <link rel="preload" as="image" href="/public/assets/player.png" />
    <link rel="preload" as="image" href="/public/assets/ground.png" />
    <link rel="preload" as="image" href="/public/assets/trail.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="game-frame" aria-label="SØD Runner">
        <div class="stage-wrap" id="stageWrap">
          <canvas id="gameCanvas" aria-label="Juego SØD Runner"></canvas>

          <header class="hud-layer" aria-live="polite">
            <div class="brand-chip">
              <img src="/public/assets/player.png" alt="" class="brand-icon" />
              <div class="brand-copy">
                <strong>SØD RUNNER</strong>
                <span>FLOW / ARCADE</span>
              </div>
            </div>

            <div class="hud-cluster">
              <div class="hud-stat hud-primary">
                <span>AVANCE</span>
                <strong id="scoreValue">00000</strong>
              </div>
              <div class="hud-stat">
                <span>RÉCORD</span>
                <strong id="recordValue">00000</strong>
              </div>
              <div class="hud-stat hud-seed" aria-label="Semillas recolectadas">
                <img src="/public/assets/semilla.png" alt="" />
                <strong id="seedValue">0</strong>
              </div>
              <button id="muteButton" class="icon-button" type="button" aria-label="Silenciar sonido" aria-pressed="false">
                <span id="muteIcon">◉</span>
              </button>
            </div>
          </header>

          <div class="stage-scanlines" aria-hidden="true"></div>
          <div class="stage-vignette" aria-hidden="true"></div>
          <div class="stage-noise" aria-hidden="true"></div>

          <div class="overlay is-visible" id="startOverlay">
            <div class="start-stack">
              <img src="/public/assets/player.png" alt="" class="hero-player" />
              <div class="eyebrow">SØD RUNNER</div>
              <h1>MANTENÉ EL PULSO.</h1>
              <p>CLICK / TAP / ESPACIO PARA ASCENDER</p>
              <button id="startButton" class="primary-button" type="button">INICIAR</button>
              <div class="micro-copy">CADA INPUT CUENTA · CONTROLÁ LA ALTURA</div>
            </div>
          </div>

          <div class="overlay" id="gameOverOverlay">
            <div class="death-card">
              <div class="eyebrow danger" id="deathEyebrow">INTERFERENCIA</div>
              <div class="death-score" id="finalScore">0</div>
              <div class="death-label">AVANCE</div>
              <div class="results-row">
                <div><span>SEMILLAS</span><strong id="finalSeeds">0</strong></div>
                <div><span>RÉCORD</span><strong id="finalRecord">0</strong></div>
              </div>
              <button id="restartButton" class="primary-button" type="button">REINTENTAR</button>
              <div class="micro-copy">CLICK · TAP · ESPACIO · ENTER</div>
            </div>
          </div>

          <div class="loading-fault" id="loadingFault" role="alert" hidden>
            <strong>ASSET ERROR</strong>
            <span>Recargá la página para volver a intentar.</span>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./game.js"></script>
  </body>
</html>
